<!DOCTYPE html>
<html>
  <head>
    <title>Loupedeck Sign-in Successful</title>

    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" href="images/icons/favicon-150x150.png" sizes="32x32" />

    <script type="application/javascript">
      function setProvider() {
        const urlParams = new URLSearchParams(window.location.search);
        const provider = urlParams.get("provider");
        const service = urlParams.get("service");

        const supportedProviders = ["google", "facebook", "loupedeck", "razer"];
        const supportedServices = ["spotify", "twitch"];

        const loginDiv = document.getElementById("login-div");
        const loginText = document.getElementById("login-text");
        const loginIcon = document.getElementById("login-icon");
        const companyLogo = document.getElementById("company-logo");
        const pageTitle = document.getElementById("page-title");
        
        if (service === "twitch") {
          document.title = "Sign-in Successful";
          companyLogo.hidden = true;
          loginDiv.hidden = true;
          pageTitle.innerText = "Twitch sign-in successful!";
        } else if (supportedProviders.includes(provider)) {
          loginDiv.hidden = false;
          loginText.innerText = "You signed into Loupedeck via";
          loginIcon.src = "images/icons/" + provider + ".svg";
        } else if (supportedServices.includes(service)) {
          loginDiv.hidden = false;
          loginText.innerText = "You signed into";
          loginIcon.src = "images/icons/" + service + ".svg";
        } else {
          loginDiv.hidden = true;
        }
      }
    </script>

    <style>
      @font-face {
        font-family: "Campton";
        src: url("fonts/light.woff2") format("woff2"),
          url("fonts/light.woff") format("woff");
        font-weight: 300;
      }
      @font-face {
        font-family: "Campton";
        src: url("fonts/book.woff2") format("woff2");
        font-weight: normal;
      }
      @font-face {
        font-family: "Campton";
        src: url("fonts/bold.woff2") format("woff2"),
          url("fonts/bold.woff") format("woff");
        font-weight: bold;
      }
      *,
      ::after,
      ::before {
        box-sizing: border-box;
      }

      html {
        font-size: 16px;
      }

      body {
        font-family: Campton, "Helvetica Neue", Helvetica, Arial, sans-serif;
        background-color: #1a1a1a;
        background-attachment: fixed;
        background-image: url("images/bg.png");
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        padding: 3rem 1.5rem;
        margin: 0;
        font-size: 0.875rem;
        font-weight: 300;
        max-width: 100vw;
        color: #9e9ca0;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-size: 1.25rem;
        font-weight: 300;
        margin: 1.5rem 0rem;
        text-align: center;
      }

      p,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        color: #f0f0f0;
        text-align: center;
      }

      a {
        color: #974ed0;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }

      ul,
      ol {
        padding-left: 0;
      }

      .icon {
        margin: 1rem;
        height: 4rem;
      }

      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 6rem);
      }
      @media (min-width: 768px) {
        .container {
          padding-top: 3rem;
          padding-bottom: 3rem;
          min-height: calc(100vh - 12rem);
        }
      }
      .container .panel {
        background-color: #29282a;
        padding: 3rem 2rem;
        max-width: 100%;
        width: 29rem;
        margin: 0 auto;
        position: relative;
        border-radius: 8px;
      }
      @media (max-width: 767px) {
        .container .panel {
          width: auto;
        }
      }
      .container .companyLogo {
        margin: 0 auto 2rem;
        display: block;
      }
    </style>
  </head>
  <body onload="setProvider()">
    <div class="container unified_container" role="presentation">
      <div class="panel panel-default">
        <div class="panel-body">
          <img
            id="company-logo"
            class="companyLogo"
            data-tenant-branding-logo="true"
            src="images/logo.svg"
            alt="Company Logo"
          />
          <h1 id="page-title">Sign-in successful!</h1>
          <p>You can close this window.</p>
          <p>
            <img
              class="icon"
              src="images/icons/success.svg"
              alt="Signin successful"
            />
          </p>
          <div id="login-div" hidden>
            <p><span id="login-text"></span></p>
            <p>
              <img id="login-icon" class="icon" alt="sign-in icon" />
            </p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
